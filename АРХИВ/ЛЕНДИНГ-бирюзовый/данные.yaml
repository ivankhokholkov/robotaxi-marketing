# Значения, которые меняются часто.
#
# Правится РУКАМИ, без запуска навыка. После правки — пересборка страницы.
# Это тот файл, про который заказчик сказал: «чтобы я мог зайти быстренько
# это всё поменять, без того чтобы тебя выдёргивать».
#
# Блоки в ЛЕНДИНГ/БЛОКИ/ подставляют значения отсюда, а не хранят их у себя.
# Поэтому цифра меняется в одном месте и обновляется везде.
#
# Метки [ПОДТВЕРДИТЬ: ...] означают, что значение не согласовано заказчиком.
# Пока метка стоит — она попадёт на страницу как есть. Это специально:
# лучше видимая метка, чем правдоподобное число, которое никто не проверял.

сервис:
  название: "[ПОДТВЕРДИТЬ: название рабочее, публично не использовать]"
  # Города сервиса и город кампании - разные вещи. Пилот по документу заказчика
  # заявлен в двух городах, реклама по его решению идёт только под Москву.
  города_сервиса: "[ПОДТВЕРДИТЬ: в документе заказчика Москва и Санкт-Петербург]"
  город_кампании: "Москва"
  дата_старта: "[ПОДТВЕРДИТЬ: у заказчика]"

# Заголовок блока тарифов живёт здесь, а не в блоке: сколько тарифов будет -
# открытая развилка заказчика (единый «Роботакси» или два под сегменты).
# Если он выберет один тариф - правится заголовок и убирается лишняя карточка.
тарифы:
  заголовок: "Два тарифа"
  модель: "[ПОДТВЕРДИТЬ: один тариф или два - у заказчика это решение или А/В тест]"
  чилл:
    название: "Чилл"
    сегмент: "18-29"
    бесплатных_минут: 15
    # По тарифам время подачи в документе однозначно: Чилл 10, Сити 5.
    # Метка стоит не из-за расхождения, а потому что параметр не подтверждён
    # письменно. Отдельный вопрос заказчику: в УТП стоит общий коммит <5 мин,
    # и он противоречит десяти минутам Чилл.
    подача_минут: "10 минут [ПОДТВЕРДИТЬ У ЗАКАЗЧИКА]"
  сити:
    название: "Сити"
    сегмент: "30-45"
    бесплатных_минут: null
    подача_минут: "5 минут [ПОДТВЕРДИТЬ У ЗАКАЗЧИКА]"

# Технические параметры. Часть с метками: в документе заказчика они есть,
# но первоисточником не подтверждены. Снимает метку заказчик, не система.
#
# Значения ниже метки «источник» пришли с публичной продуктовой страницы
# Яндекса и по references/rtb-факты.md идут без [ПОДТВЕРДИТЬ], но всегда
# рядом со ссылкой на источник. Поэтому на странице под ними стоит сноска.
технические:
  лидар_дальность_м: "[ПОДТВЕРДИТЬ У ЗАКАЗЧИКА: 250]"
  лидар_обзор_град: "[ПОДТВЕРДИТЬ У ЗАКАЗЧИКА: 360]"
  # УСТАРЕЛО: «9 датчиков и камер» — ошибочная формулировка раннего документа,
  # смешивает камеры с остальными сенсорами (см. references/rtb-факты.md).
  # В блоках не используется; вместо неё — набор_восприятия ниже.
  датчиков_и_камер: "[ПОДТВЕРДИТЬ У ЗАКАЗЧИКА: 9]"
  точность_локализации: "[ПОДТВЕРДИТЬ У ЗАКАЗЧИКА: до 1 см]"
  набор_восприятия: "9 камер, 4 лидара, 6 радаров"
  пробег_автономный: "35 млн км"
  срок_разработки: "более 8 лет"
  источник: "продуктовая страница Яндекса, autonomy.yandex.ru/products/robotaxi"

# Правовой режим. Формулировку «без водителя» использовать нельзя:
# у 1 категории пилот-испытатель в салоне обязателен. Разбор — в
# references/стоп-слова.md, раздел 7.
правовое:
  категория_ватс: "1 категория"

# Зона пилота. Правится, когда заказчик согласует границы.
# Список районов пока расходится между двумя документами — поэтому метка,
# а не правдоподобное перечисление улиц.
зона:
  заголовок: "Где ездим на пилоте"
  формат: "трафик-коридоры, 2-3 района"
  районы: "[ПОДТВЕРДИТЬ: в вопросах к Го названы Бабушкинская и Медведково, у ПП 309 пассажирская зона Москвы это Ясенево и Сколково]"
  расширение: "[ПОДТВЕРДИТЬ: что происходит с зоной после пилота]"

# Первая поездка. Механика входа — открытая развилка заказчика:
# ранний документ обещает бесплатные минуты, стратегия пилота промо-код.
# В одном материале они не смешиваются, поэтому здесь одно значение.
поездка:
  канал_заказа: "[ПОДТВЕРДИТЬ: в профиле указано приложение Яндекс Go]"
  механика_входа: "[ПОДТВЕРДИТЬ: бесплатные первые минуты или промо-код 300 руб через амбассадоров]"
  обратная_связь: "[ПОДТВЕРДИТЬ: формат обратной связи после поездки]"

# ЗАПРЕЩЕНО добавлять сюда: число машин, себестоимость поездки,
# целевые CSAT и NPS, партнёров. Это закрытые данные по профилю проекта,
# а файл попадает на публичную страницу.
