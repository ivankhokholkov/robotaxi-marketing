<!-- Образец паттерна «полоса с действием». На странице такая полоса одна:
     ключевая точка воронки — пробная поездка, и она не конкурирует сама с собой. -->
<section class="блок" id="действие">
  <div class="полоса">
    <div>
      <h2>Пробная поездка</h2>
      <p class="лид">Отношение к сервису меняет поездка, а не описание сервиса.</p>
    </div>

    <div class="действия">
      <a class="кнопка кнопка--акцент" href="[ПОДТВЕРДИТЬ: ссылка на форму записи]">Записаться</a>
    </div>
  </div>

  <p class="сноска">
    Старт пилота: {{сервис.дата_старта}}. Город кампании: {{сервис.город_кампании}}.
  </p>
</section>
