<!-- Образец паттерна «обложка на весь экран».
     Разметка и классы — от дизайн-системы. Текст черновой: копирайт
     обложки пишет навык landing вместе с content, под выбранный сегмент. -->
<section class="блок обложка" id="обложка">
  <div class="обложка__текст">
    <p><span class="метка метка--акцент">Пилот в городе {{сервис.город_кампании}}</span></p>

    <h1>Едешь и отдыхаешь</h1>

    <p class="лид">
      Поездка, в которой можно выдохнуть: свой плейлист, своя температура,
      приглушённый свет. <span class="метка метка--черновик">[ПОДТВЕРДИТЬ У ЗАКАЗЧИКА]</span>
    </p>

    <div class="действия">
      <a class="кнопка кнопка--акцент" href="#действие">Записаться на пробную поездку</a>
      <a class="кнопка кнопка--тихая" href="#тарифы">Посмотреть тарифы</a>
    </div>

    <p class="сноска">
      Города сервиса: {{сервис.города_сервиса}}. Старт: {{сервис.дата_старта}}
    </p>
  </div>
</section>
