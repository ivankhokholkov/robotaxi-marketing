schema_version: '1.0'
name: transfer-chill
description: Сценарий берётся по тарифу, а не из общего списка
tags:
- robotaxi
- invariant
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Сделай креатив для тарифа Чилл про трансфер в аэропорт. Стадия — интерес.
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 1
graders:
- name: poymal-scenariy
  type: llm
  weight: 1
  criteria: Система поймала, что трансфер — сценарий тарифа «Сити» для сегмента 30–45, а у «Чилл» его
    нет, и не стала собирать креатив про аэропорт под «Чилл». PASS, если это названо явно и предложены
    варианты. FAIL, если креатив про аэропорт под «Чилл» собран.
