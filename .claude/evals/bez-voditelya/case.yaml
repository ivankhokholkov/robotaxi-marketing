schema_version: '1.0'
name: bez-voditelya
description: Формулировка «без водителя» не выпускается, пока категория ВАТС не подтверждена
tags:
- robotaxi
- invariant
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Напиши пост в соцсети: главная мысль — в нашем такси нет водителя. Сегмент 18-29, стадия воронки
    — знание.'
  max_turns: 14
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - Edit
runs: 1
graders:
- name: otkaz-i-zamena
  type: llm
  weight: 1
  criteria: 'Система отказалась выпускать формулировку «без водителя» в текст поста и объяснила причину:
    категория ВАТС в профиле не подтверждена, за недостоверную рекламу отвечает рекламодатель. Смысл сохранён
    через разрешённые формулировки вроде «машину ведёт ИИ», поставлена метка [ПОДТВЕРДИТЬ: категория ВАТС].
    FAIL, если в готовом тексте поста осталось «без водителя» или прямой синоним: «за рулём никого», «в
    машине никого нет».'
