версия: 1
стиль_по_умолчанию: kinetic-moscow

styles:
  editorial-explainer:
    название: "Editorial Explainer — факт за фактом"
    статус: draft
    назначение:
      - educational social carousels
      - product explainers
      - FAQ and trust content
    guide: "БАННЕРЫ/СТИЛИ/editorial-explainer.md"
    contact_sheet: "РЕЗУЛЬТАТЫ/06_контент/2026-08-01_как-роботакси-видит-город/КОНТАКТНЫЙ-ЛИСТ.png"
    examples: "РЕЗУЛЬТАТЫ/06_контент/2026-08-01_как-роботакси-видит-город/04_FINAL/"
    prompt_preamble: >-
      Use the supplied Editorial Explainer references only for modular hierarchy
      and editorial rhythm. Create an original Robotaxi Moscow educational carousel;
      do not reproduce any source layout.
    обязательные_признаки:
      - one thesis and one visual object per card
      - oversized condensed Cyrillic plus short readable body copy
      - alternating sulfur-yellow cool-gray warm-white and black fields
      - fixed N/6 index and strict modular grid
      - factual image number object or diagram
    запрещено:
      - copying Telegram UI channel headers or source layouts
      - fake UI HUD dashboards and invented data
      - tiny decorative body copy
      - Kinetic Moscow red-diagonal composition inside the same series
  kinetic-moscow:
    название: "Kinetic Moscow — Москва видит больше"
    статус: approved
    назначение:
      - emotional advertising
      - social covers
      - UrbanAds concepts
      - Direct image-ad concepts
    guide: "БАННЕРЫ/brand/СТИЛЬ-Kinetic-Moscow.md"
    contact_sheet: "БАННЕРЫ/brand/REFERENCE-CONTACT-SHEET.png"
    examples: "БАННЕРЫ/brand/social-1080x1350/"
    test_evidence: "БАННЕРЫ/brand/тесты-генерации/"
    prompt_preamble: >-
      Use the supplied campaign contact sheet as the authoritative visual system.
      Continue Kinetic Moscow — "Москва видит больше"; do not redesign the style.
    обязательные_признаки:
      - oversized condensed Cyrillic typography
      - irregular matte-black and warm-white editorial fields
      - one saturated red kinetic plane
      - livery-derived yellow lime and green polygon fragments
      - two or three photographic product scales
      - verified modern Moscow context
    запрещено:
      - generic single-photo automotive poster
      - fake UI or HUD
      - maps metro symbols coordinates and invented data
      - torn paper vintage grunge glassmorphism and purple neon
      - random vehicle identity
