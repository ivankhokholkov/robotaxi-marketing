# Пресеты форматов для генерации, дизайна и технической приёмки.
# Снимок публичных требований Яндекса: 2026-07-31.
# Перед медиазапуском требования сверяются повторно: площадки меняют их без предупреждения.

снимок_данных: 2026-07-31
сверено_с_карточками: 2026-08-01
подробная_матрица: ПЛОЩАДКИ-И-ФОРМАТЫ-2026.md
референсы_и_промпт: brand/ЧТО-ОТПРАВЛЯТЬ-В-ГЕНЕРАЦИЮ.md
стиль: brand/СТИЛЬ-Kinetic-Moscow.md

# Этот файл — машиночитаемый источник правды по размерам, весу, охранным зонам
# и пути текста. Проза с объяснениями — в ПЛОЩАДКИ-И-ФОРМАТЫ-2026.md.
# При расхождении между ними прав этот файл, а над ним — только карточки
# knowledge/ с датой снимка и статусом CONFIRMED.

общие_правила:
  текст_внутри_изображения:
    smm_органика: >
      Допускается генерировать вместе с изображением в GPT Image 2, если это
      часть утверждённого арт-дирекшена. Каждая буква проверяется вручную.
    рся_urbanads_геореклама: >
      Финальная типографика накладывается в точном макете. Генератор может
      сделать фон и композиционный черновик, но не является источником
      готового текста для малых и регулируемых рекламных форматов.

  # Два пути текста. У каждого формата ниже стоит поле путь_текста с одним из
  # этих двух значений. Путать их нельзя: это разные производственные маршруты,
  # а не стилистическое предпочтение.
  # Какая модель что умеет. Проверено на живых прогонах 30.07 и 01.08.
  # Это главный выбор перед генерацией — от него зависит путь текста.
  модели:
    openai/gpt-5.4-image-2:
      она_же: GPT Image 2
      цена: 4 ₽ за 1K, 7 ₽ за 2K
      кириллица: >
        Пишет русский текст без ошибок, включая длинные заголовки и подписи
        капслоком. Подтверждено дважды: кампания «Москва видит больше» 30.07
        и контрольный тест 01.08. Это модель по умолчанию, когда текст нужен
        внутри кадра.
      машина: >
        Держит облик по словесному паспорту и принимает референсы ключом --ref
        (проверено 01.08.2026). На вертикали 9:16 показала себя лучше конкурента.
        Контрольные тесты 01.08: четыре референса дали заметно более точную
        машину, чем два. Разбор — brand/тесты-генерации/README.md.
      референсов_мало_не_бывает_но: >
        Деталь, которую модель систематически упрощает (крышный модуль),
        описывается ещё и словами, с прямым перечислением неверных вариантов.
        Шаблон промпта — brand/ЧТО-ОТПРАВЛЯТЬ-В-ГЕНЕРАЦИЮ.md.
    google/gemini-3.1-flash-image-preview:
      она_же: Nano Banana
      цена: 4,8 ₽
      кириллица: >
        Ломается. Вместо надписи выдаёт бессмысленный набор букв — поймано на
        двери автомобиля. Текст этой модели не поручается никогда.
      машина: >
        Принимает до десяти референсных фотографий и на горизонтальных кадрах
        держит облик точнее. На вертикали 9:16 пять раз подряд подставила
        чужой кузов.
      применение: фон и автомобиль по фото-референсам, без единой буквы в кадре

  пути_текста:
    в_кадре:
      где: SMM, презентации, визуалы лендинга, демонстрационные концепты
      модель: только openai/gpt-5.4-image-2
      как: >
        Модель генерирует законченное изображение вместе с типографикой.
        Точный текст передаётся в промпт в кавычках через «Text exactly», плюс
        требование безупречной русской орфографии и запрет любого другого
        текста в кадре.
      по_умолчанию: >
        Для этих форматов это основной путь, а не разрешённое исключение.
        Типографика, сгенерированная вместе с изображением, врастает в
        композицию: крупный заголовок работает как архитектура кадра, а не как
        плашка поверх фотографии. Накладка кодом здесь — запасной вариант.
      обязательно: >
        Каждая буква проверяется глазами после генерации. Две неудачные
        целевые правки подряд — переход на накладку кодом без смены композиции.
      почему_можно: >
        Решение заказчика. В этих форматах типографика является частью
        арт-дирекшена, лимитов по символам и минимальному кеглю нет.
    накладка_кодом:
      где: РСЯ, UrbanAds, геореклама в Яндекс Картах
      как: >
        Модель делает только фон, автомобиль и композиционный черновик.
        Заголовок, подпись, логотип и дисклеймер накладываются слоем в точном
        холсте по SVG-гайду из папки СЕТКИ.
      почему_обязательно:
        - лимиты площадки считаются в символах и проверяются кодом, а не глазом
        - у форматов есть минимальный кегль, модель в него не попадает
        - охранные зоны и автоматические пометки площадки обходятся точно
        - параметра seed в API нет, воспроизвести кадр с другим текстом нельзя
      без_исключений: >
        Для оплаченного размещения накладка кодом обязательна всегда, даже если
        генератор случайно написал текст правильно.

  # Фирменный приём кампании: обычный мир и то же самое облаком точек лидара.
  # Обязателен там, где формат его держит. Подробности — навык design-system.
  сплит_скрин:
    статус: обязательный фирменный приём, а не вариант оформления
    у_каждого_формата_ниже: поле сплит_скрин со значением да, нет или намёк
    намёк: >
      Для ультраузких полос вместо двух сцен используется тонкая линия точек по
      краю кадра или облако точек только на сенсорном модуле.
    запрещено_в_облаке_точек:
      - кнопки, шкалы, рамки, подписи расстояний и любой псевдоинтерфейс
      - цифры дальности и обзора: в ядре бренда они с меткой ПОДТВЕРДИТЬ
      - сходство с экраном приложения Яндекс Go
      - облако точек поверх лица человека крупным планом
  обязательная_проверка:
    - логотипа автопроизводителя нет ни на одной детали кадра
    - точный размер холста
    - вес и формат файла
    - охранные зоны площадки
    - читаемость в реальном масштабе показа
    - кириллица и факты
    - права на автомобиль, локацию и логотип
  запрещено_в_кадре:
    # 01.08.2026: поймано на живых кадрах — логотип автопроизводителя читался
    # на решётке и капоте. В промпт добавляется явный запрет, при приёмке
    # проверяется отдельным пунктом, на готовом кадре снимается ретушью.
    - логотип и шильдик автопроизводителя (решётка, капот, руль, колёсные диски,
      крышка багажника). Машина в кадре — Роботакси Яндекса, а не модель бренда
    - имитация элементов интерфейса Яндекса
    - самодельные QR-коды, если площадка не добавляет их сама
    - неподтверждённые цифры и обещания
    - случайная модель автомобиля

smm_внутренние_мастера:
  примечание: >
    Это производственные размеры проекта, а не универсальные требования
    каждой соцсети. Композиция утверждается отдельно от рекламных адаптаций.
  путь_текста: в_кадре
  сплит_скрин: да
  карусель_4x5: {w: 1080, h: 1350, сплит: грань по вертикали}
  квадрат: {w: 1080, h: 1080, сплит: грань по вертикали}
  сторис_9x16: {w: 1080, h: 1920, сплит: грань по горизонтали}

рся:
  путь_текста: накладка_кодом
  единый_перфоманс_креатив:
    мин_сторона_px: 450
    макс_вес_мб: 10
    форматы_файла: [jpg, png, gif]
    лимиты_символов:
      заголовок: 56
      макс_длина_слова_в_заголовке: 22
      доп_заголовок: 30
      текст: 81
      макс_длина_слова_в_тексте: 23
      быстрая_ссылка: 30
      описание: 60
      уточнение: 25
    комплект:
      заголовков_до: 7
      текстов_до: 3
      изображений_до: 5

  доля_текста_и_лого_на_изображении:
    порог: 0.20
    статус: рекомендация площадки, не жёсткая норма модерации
    источник: карточка epk-zaprety-na-kreative, снимок 2026-07-30, CONFIRMED
    точная_формулировка: >
      Справка пишет «мы рекомендуем, чтобы они не занимали более 20%» и делает
      исключение для изображения графического объявления, то есть для баннера.
    как_держим: >
      Держим 20% как запас на модерацию, а не потому что это обязательно.
      Превышение — жёлтый флаг и разговор с человеком, а не автоматический брак.
    считается: замер.py, поле макс_доля_текста

  запрещено_на_изображении:
    источник: карточка epk-zaprety-na-kreative, снимок 2026-07-30, CONFIRMED
    список:
      - "элементы дизайна страниц Яндекса: поисковая строка, кнопки, имитация интерфейса"
      - QR-коды

  графические_баннеры:
    макс_вес_кб: 512
    форматы_файла: [jpg, png, gif]   # WEBP не принимается
    сплит_скрин:
      да: [300x250, 300x300, 300x500, 300x600, 336x280, 240x400, 240x600, 320x480, 480x320, 970x250]
      намёк: [320x50, 320x100, 728x90, 1000x120, 160x600]
      причина_намёка: >
        На высоте до 120 px две сцены не читаются ни одна. Вместо сплита —
        тонкая линия точек по краю или облако точек на сенсорном модуле.
    размеры:
      - {w: 240, h: 400}
      - {w: 300, h: 250}
      - {w: 300, h: 500}
      - {w: 300, h: 600}
      - {w: 320, h: 50}
      - {w: 320, h: 100}
      - {w: 320, h: 480}
      - {w: 336, h: 280}
      - {w: 480, h: 320}
      - {w: 728, h: 90}
      - {w: 970, h: 250}
    размеры_медийная_дополнительно:
      - {w: 160, h: 600}
      - {w: 240, h: 600}
      - {w: 300, h: 300}
      - {w: 1000, h: 120}
    примечание: >
      Для высокой плотности экрана файл допустимо готовить в масштабе 2x или
      3x при сохранении пропорций. Конструктор креативов больше не является
      рабочим производственным маршрутом; загружаются собственные макеты.

геореклама_яндекс_карты:
  путь_текста: накладка_кодом
  сплит_скрин: намёк
  примечание_по_приёму: >
    Все форматы Карт ультраширокие и низкие. Полноценный сплит в них не
    читается: используется линия точек по краю или облако точек на сенсорном
    модуле.
  баннер_при_остановке_или_построении_маршрута:
    размер: {w: 1280, h: 256}
    макс_вес_мб: 1
    формат: png            # только PNG: ни jpg, ни gif, ни html5
    свободные_области_слева_и_справа_px: 60
    мин_размер_шрифта_px: 48
    макс_доля_прозрачного_фона: 0.50
    источник: карточка yandex-karty-premium-banner-1280x256, снимок 2026-07-31, CONFIRMED
    примечание: >
      Пометка «Реклама» и сервисные элементы добавляются площадкой, поэтому по
      60 px слева И справа остаются без изображения. Не использовать светлый
      фон (ночной режим Навигатора слепит водителя), обводку вокруг баннера и
      каллиграфические шрифты. До 01.08.2026 здесь ошибочно стояло 16 px и
      только слева.
  брендирование_маршрута:
    пин: {w: 200, h: 200, макс_вес_мб: 1, формат: png}
    баннер_карточки: {w: 1200, h: 400, макс_вес_мб: 1, формат: png}
    баннер_в_картах: {w: 1280, h: 256, макс_вес_мб: 1, формат: png}
    билборд: {w: 264, h: 160, макс_вес_мб: 1, формат: png}

urbanads:
  примечание: >
    UrbanAds — отдельный кабинет с инвентарём в Маркете, Go, Деливери,
    Еде, Лавке, Доставке, Аптеках и на планшетах в такси. Это не тот же
    формат, что баннер 1280x256 в Яндекс Картах.
  макс_вес_мб: 2
  форматы_файла: [png, jpg, jpeg]
  шрифты_рекомендованы: [YS Display Heavy, YS Text Regular]
  путь_текста: накладка_кодом
  горизонтальный:
    размер: {w: 1080, h: 450}
    безопасная_зона: {w: 990, h: 410}
    мин_шрифт: {заголовок: 80, подзаголовок: 40}
    сплит_скрин: да, грань по вертикали, текст целиком на одной половине
    сервисы: [Маркет, Go, Деливери, Еда, Лавка, Доставка, Аптеки]
  растяжка:
    размер: {w: 1706, h: 184}
    безопасная_зона: {w: 1564, h: 184}
    мин_шрифт: {заголовок: 60, подзаголовок: 36}
    сплит_скрин: намёк, высота не держит две сцены
    сервисы: [Маркет]
  вертикальный:
    размер: {w: 940, h: 1524}
    безопасная_зона: {w: 800, h: 1326}
    скрывается_снизу_px: 232
    мин_шрифт: {заголовок: 124, подзаголовок: 64}
    сплит_скрин: да, грань по горизонтали, облако точек не уводить в нижние 232 px
    сервисы: [Маркет, Go, Лавка]
    парный_горизонтальный_файл: {w: 1080, h: 450}
  попап:
    размер: {w: 720, h: 720}
    безопасная_зона: {w: 660, h: 630}
    сплит_скрин: да, грань по вертикали
  видео:
    мин_размер: {w: 960, h: 540}
    макс_размер: {w: 1920, h: 1080}
    безопасная_зона_для_1920x1080: {w: 1920, h: 860}
    макс_длительность_сек: 30
    макс_вес_мб: 100
    правило: "Не размещать текст в нижней трети. Ролик должен читаться без звука."

не_для_площадок:
  путь_текста: в_кадре
  сплит_скрин: да
  блок_лендинга: {w: 1536, h: 1024}
  превью_презентации: {w: 1536, h: 1024}

порядок_производства:
  - "Получить и проверить пакет исходников заказчика."
  - "Взять строку из БАННЕРЫ/ОЧЕРЕДЬ.md либо задачу голосом."
  - "Выбрать площадку и точный формат до генерации."
  - "Посмотреть путь_текста формата: в кадре или накладкой кодом."
  - "Посмотреть сплит_скрин формата: да, намёк или нет."
  - "Режим повторить — взять замороженный шаблон из БАННЕРЫ/ЭТАЛОНЫ.md."
  - "Собрать отдельный мастер под группу близких пропорций."
  - "Не нарезать 4:5 в ультраширокий 1280x256 и наоборот."
  - "Собрать финальную типографику и охранные зоны в точном макете."
  - "Прогнать техническую и визуальную проверку в реальном размере показа."
  - "Не прошло — макет не отмечается как готовый."
  - "Прошло — завести строку в БАННЕРЫ/РЕЕСТР-КРЕАТИВОВ.md."
